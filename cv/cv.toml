# site. Same rule as the site: every figure is read from an artefact, and the
# official job title stays visible beside the functional one.
#
#   .venv/bin/python tools/make-cv.py            # all variants
#   .venv/bin/python tools/make-cv.py --preview  # also PNGs, to look at

